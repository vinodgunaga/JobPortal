name: CI/CD — Job Portal

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/jobportal-api

jobs:
  # ──────────────────────────────────────────
  # JOB 1: Build and test the .NET app
  # ──────────────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal

  # ──────────────────────────────────────────
  # JOB 2: Build Docker image and push to Docker Hub
  # ──────────────────────────────────────────
  docker-push:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

  # ──────────────────────────────────────────
  # JOB 3: Run EF migrations against Azure SQL
  # ──────────────────────────────────────────
  migrate-database:
    runs-on: ubuntu-latest
    needs: docker-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install EF tools
        run: dotnet tool install --global dotnet-ef

      - name: Add dotnet tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Restore dependencies
        run: dotnet restore JobPortal.API/JobPortal.API.csproj

      - name: Build
        run: dotnet build JobPortal.API/JobPortal.API.csproj --configuration Release --no-restore

      - name: Run EF migrations
        run: |
          dotnet ef database update \
            --project JobPortal.Infrastructure/JobPortal.Infrastructure.csproj \
            --startup-project JobPortal.API/JobPortal.API.csproj \
            --connection "${{ secrets.AZURE_SQL_CONNECTION_STRING }}" \
            --verbose

  # ──────────────────────────────────────────
  # JOB 4: Deploy to Render.com
  # ──────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: migrate-database
    environment: production
    steps:
      - name: Trigger Render deploy hook
        run: |
          curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
