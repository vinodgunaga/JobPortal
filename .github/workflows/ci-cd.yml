name: CI/CD — Job Portal

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ACR_IMAGE: ${{ secrets.ACR_LOGIN_SERVER }}/jobportal-api

jobs:
  # ──────────────────────────────────────────
  # JOB 1: Build and test the .NET app
  # ──────────────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal

  # ──────────────────────────────────────────
  # JOB 2: Build Docker image and push to ACR
  # ──────────────────────────────────────────
  docker-push:
    runs-on: ubuntu-latest
    needs: build-and-test # only runs if tests pass
    if: github.ref == 'refs/heads/main' # only on main branch (not PRs)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile #Dockerfile path (if not in root ./src/JobPortal.API/Dockerfile)
          push: true
          tags: |
            ${{ env.ACR_IMAGE }}:latest
            ${{ env.ACR_IMAGE }}:${{ github.sha }}

  # ──────────────────────────────────────────
  # JOB 3: Run EF migrations
  # ──────────────────────────────────────────
  migrate-database:
    runs-on: ubuntu-latest
    needs: docker-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install EF tools
        run: dotnet tool install --global dotnet-ef

      - name: Run EF migrations
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
        run: |
          dotnet ef database update \
            --project JobPortal.Infrastructure \
            --startup-project JobPortal.API \
            --no-build

  # ──────────────────────────────────────────
  # JOB 4: Deploy to Azure App Service
  # ──────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: migrate-database
    environment: production # optional: adds a manual approval gate
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy container to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: jobportal-api
          images: ${{ env.ACR_IMAGE }}:${{ github.sha }}

      - name: Set App Service environment variables
        uses: azure/appservice-settings@v1
        with:
          app-name: jobportal-api
          app-settings-json: |
            [
              {
                "name": "ConnectionStrings__Default",
                "value": "${{ secrets.AZURE_SQL_CONNECTION_STRING }}",
                "slotSetting": false
              },
              {
                "name": "Jwt__Key",
                "value": "${{ secrets.JWT_SECRET }}",
                "slotSetting": false
              },
              {
                "name": "Jwt__Issuer",
                "value": "JobPortalAPI",
                "slotSetting": false
              },
              {
                "name": "Jwt__Audience",
                "value": "JobPortalUsers",
                "slotSetting": false
              },
              {
                "name": "Email__Host",
                "value": "${{ secrets.EMAIL_HOST }}",
                "slotSetting": false
              },
              {
                "name": "Email__Port",
                "value": "587",
                "slotSetting": false
              },
              {
                "name": "Email__Username",
                "value": "${{ secrets.EMAIL_USERNAME }}",
                "slotSetting": false
              },
              {
                "name": "Email__Password",
                "value": "${{ secrets.EMAIL_PASSWORD }}",
                "slotSetting": false
              },
              {
                "name": "Email__FromAddress",
                "value": "${{ secrets.EMAIL_FROM_ADDRESS }}",
                "slotSetting": false
              },
              {
                "name": "Email__FromName",
                "value": "JobPortal",
                "slotSetting": false
              },
              {
                "name": "AppUrl",
                "value": "${{ secrets.APP_URL }}",
                "slotSetting": false
              },
              {
                "name": "ASPNETCORE_ENVIRONMENT",
                "value": "Production",
                "slotSetting": false
              }
            ]
