#       - 8080:8080

# # The commented out section below is an example of how to define a PostgreSQL
# # database that your application can use. `depends_on` tells Docker Compose to
# # start the database before your application. The `db-data` volume persists the
# # database data between container restarts. The `db-password` secret is used
# # to set the database password. You must create `db/password.txt` and add
# # a password of your choosing to it before running `docker compose up`.
# #     depends_on:
# #       db:
# #         condition: service_healthy
# #   db:
# #     image: postgres
# #     restart: always
# #     user: postgres
# #     secrets:
# #       - db-password
# #     volumes:
# #       - db-data:/var/lib/postgresql/data
# #     environment:
# #       - POSTGRES_DB=example
# #       - POSTGRES_PASSWORD_FILE=/run/secrets/db-password
# #     expose:
# #       - 5432
# #     healthcheck:
# #       test: [ "CMD", "pg_isready" ]
# #       interval: 10s
# #       timeout: 5s
# #       retries: 5
# # volumes:
# #   db-data:
# # secrets:
# #   db-password:
# #     file: db/password.txt

version: "3.9"

services:
  web:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy # waits until healthcheck passes
    environment:
      - ConnectionStrings__Default=Server=db;Database=${DB_NAME};User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=JobPortalAPI
      - Jwt__Audience=JobPortalUsers
      - Email__Host=${EMAIL_HOST}
      - Email__Port=${EMAIL_PORT}
      - Email__Username=${EMAIL_USERNAME}
      - Email__Password=${EMAIL_PASSWORD}
      - Email__FromAddress=${EMAIL_FROM_ADDRESS}
      - Email__FromName=${EMAIL_FROM_NAME}
      - AppUrl=${APP_URL}
    restart: on-failure

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${DB_PASSWORD}
    ports:
      - "1433:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${DB_PASSWORD}' -Q 'SELECT 1' -No -C || exit 1",
        ]
      interval: 10s # check every 10 seconds
      timeout: 5s # fail if no response in 5s
      retries: 8 # try 8 times before giving up (~80 seconds total)
      start_period: 20s # give SQL Server 20s to boot before first check
    volumes:
      - sqldata:/var/opt/mssql

volumes:
  sqldata:
